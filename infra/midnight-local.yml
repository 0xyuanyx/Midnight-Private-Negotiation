services:
  buyer-proof-server:
    image: midnightntwrk/proof-server:8.0.3
    container_name: negotiation-v2-buyer-proof
    command: ["midnight-proof-server -v"]
    ports:
      - "6301:6300"
    environment:
      RUST_BACKTRACE: full

  seller-proof-server:
    image: midnightntwrk/proof-server:8.0.3
    container_name: negotiation-v2-seller-proof
    command: ["midnight-proof-server -v"]
    ports:
      - "6302:6300"
    environment:
      RUST_BACKTRACE: full

  midnight-node:
    image: midnightntwrk/midnight-node:0.22.3
    container_name: negotiation-v2-node
    ports:
      - "9944:9944"
    environment:
      CFG_PRESET: dev
      SIDECHAIN_BLOCK_BENEFICIARY: 04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

  indexer:
    image: midnightntwrk/indexer-standalone:4.0.0
    container_name: negotiation-v2-indexer
    env_file: midnight-local.env
    ports:
      - "8088:8088"
    environment:
      RUST_LOG: indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info
      APP__APPLICATION__NETWORK_ID: undeployed
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      midnight-node:
        condition: service_healthy
